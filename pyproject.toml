[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "croncraft"
version = "1.0.0"
description = "Human English to Cron Translator & Schedule Explainer CLI"
readme = "README.md"
authors = [
  { name = "Moch. Erik Irriansyah", email = "erik@narotama.ac.id" }
]
license = { text = "MIT" }
keywords = ["cron", "crontab", "scheduler", "natural-language", "cli", "sysadmin"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
requires-python = ">=3.8"
dependencies = []

[project.scripts]
croncraft = "croncraft.cli:main"

[project.urls]
Homepage = "https://github.com/MochErik/croncraft"
Repository = "https://github.com/MochErik/croncraft.git"
Issues = "https://github.com/MochErik/croncraft/issues"
